denoise:
  name: denoise
  channels: 64
  depth: 5
  kernel_size: 3
  dilation: [1, 1, 1, 2, 1, 1, 1]

train:
  mode: denoise
  epochs: 50
  batch_size: 1
  patches_per_image: 3
  lr: 0.003
  # l1 | mse | huber | smooth_l1
  loss: l1
  result_every: 25
  grad_every: 25
  train_crop: [512, 768, 1024]
  test_crop: [512]

noise:
  clean: 10
  near_zero: 15
  low: 25
  iso: 35
  mix: 10
  hard: 5

eval:
  enabled: true
  seed: 42
  sigma: 0.03
  crop_size: 512

data:
  result_dir: data/result/
  test_dir: data/test/
  train_dir: data/train/
  ckpt_dir: checkpoints/

  denoise_path: denoise.pth
  denoise_checkpoint: denoise_cpt.pth